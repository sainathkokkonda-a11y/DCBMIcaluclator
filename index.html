<div class="global-bmi-container">
  <div class="global-bmi-card">
    <div class="global-bmi-header">
      <h2>BMI Calculator</h2>
      <p>Check your Body Mass Index & Health Status</p>
    </div>
    
    <div class="global-bmi-body">
      <div class="unit-toggle">
        <button id="metricBtn" class="unit-btn active" onclick="switchUnit('metric')">Metric (cm/kg)</button>
        <button id="imperialBtn" class="unit-btn" onclick="switchUnit('imperial')">Imperial (ft+in/lbs)</button>
      </div>

      <!-- Metric Inputs -->
      <div id="metricInputs">
        <div class="input-group">
          <label for="heightCm">Height (cm)</label>
          <input type="number" id="heightCm" class="global-input" placeholder="e.g. 170" value="170">
        </div>
        <div class="input-group">
          <label for="weightKg">Weight (kg)</label>
          <input type="number" id="weightKg" class="global-input" placeholder="e.g. 68" value="68">
        </div>
      </div>

      <!-- Imperial Inputs -->
      <div id="imperialInputs" style="display: none;">
        <div class="input-group">
          <label>Height (Feet & Inches)</label>
          <div class="input-flex-wrapper">
            <input type="number" id="heightFt" class="global-input" placeholder="Feet" value="5">
            <input type="number" id="heightIn" class="global-input" placeholder="Inches" value="7">
          </div>
        </div>
        <div class="input-group">
          <label for="weightLbs">Weight (lbs)</label>
          <input type="number" id="weightLbs" class="global-input" placeholder="e.g. 150" value="150">
        </div>
      </div>

      <button class="btn-calculate" onclick="calculateBMI()">Calculate BMI</button>

      <div class="result-box">
        <div style="font-size: 14px; color: #1565c0; font-weight: 600;">Your BMI Score:</div>
        <div class="bmi-value" id="bmiResult">0.0</div>
        <div id="bmiStatus" class="bmi-status">Normal Weight</div>
      </div>
    </div>
  </div>
</div>
